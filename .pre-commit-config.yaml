repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        args: [--fix, --min-severity=medium]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [javascript, ts, svelte, css, json, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [javascript, ts, svelte]
        exclude: ^build/
