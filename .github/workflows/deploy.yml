name: Deploy

on:
  push:
    branches: [master]

# id-token: write is required to request the GitHub OIDC JWT
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          # Assumes the github-actions role via OIDC. Terraform then assumes the
          # deploy role via the assume_role block in deploy/website/providers.tf.
          role-to-assume: arn:aws:iam::506333259771:role/nicholasjunge-github-actions
          aws-region: us-east-1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"

      - name: Terraform init
        run: terraform init
        working-directory: deploy/website

      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: deploy/website
