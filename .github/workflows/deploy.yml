name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write # required to request the GitHub OIDC JWT
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # Assumes the github-actions role via OIDC. Terraform then assumes the
          # deploy role via the assume_role block in deploy/website/providers.tf.
          role-to-assume: arn:aws:iam::506333259771:role/nicholasjunge-github-actions
          aws-region: us-east-1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write Google Search Console verification file
        env:
          TOKEN: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: |
          printf 'google-site-verification: google%s.html\n' "$TOKEN" > "static/google${TOKEN}.html"

      - name: Build site
        run: npm run build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~> 1.9'

      - name: Terraform init
        run: terraform init
        working-directory: deploy/website

      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: deploy/website
