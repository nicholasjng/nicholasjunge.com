name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

# Queue rather than cancel: an interrupted apply can leave state half-written.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # No id-token permission: npm code running here can't obtain AWS credentials.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write Google Search Console verification file
        env:
          TOKEN: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: |
          printf 'google-site-verification: google%s.html\n' "$TOKEN" > "static/google${TOKEN}.html"

      - name: Build site
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the GitHub OIDC JWT
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Terraform then assumes the deploy role (deploy/website/providers.tf).
          role-to-assume: arn:aws:iam::506333259771:role/nicholasjunge-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.2'
          # The wrapper adds extra lines to `terraform output -raw` stdout.
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init
        working-directory: deploy/website

      - name: Terraform apply
        run: terraform apply -auto-approve
        working-directory: deploy/website

      - name: Read distribution ID
        id: tf
        run: echo "cloudfront_id=$(terraform output -raw cloudfront_id)" >> "$GITHUB_OUTPUT"
        working-directory: deploy/website

      # Only the deploy role may invalidate; the github-actions role can do
      # nothing but assume it.
      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::506333259771:role/nicholasjunge-deploy
          role-chaining: true
          # Session tags would need sts:TagSession on both roles.
          role-skip-session-tagging: true
          aws-region: us-east-1

      # Without this, changes that only touch object metadata (Content-Type,
      # Cache-Control) are never picked up: CloudFront revalidates by ETag,
      # gets a 304 and keeps serving the old headers.
      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.tf.outputs.cloudfront_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'

      - name: Read distribution ID
        id: tf
        run: echo "cloudfront_id=$(terraform output -raw cloudfront_id)" >> "$GITHUB_OUTPUT"
        working-directory: deploy/website

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::506333259771:role/nicholasjunge-deploy
          role-chaining: true
          # Tagging would need sts:TagSession on both roles.
          role-skip-session-tagging: true
          aws-region: us-east-1

      # Metadata-only changes are otherwise never served: ETag revalidation returns 304.
      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.tf.outputs.cloudfront_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
